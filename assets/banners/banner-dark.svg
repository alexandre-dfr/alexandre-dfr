<svg width="1200" height="400"
     viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#050914"/>
        <stop offset="50%" stop-color="#091525"/>
        <stop offset="100%" stop-color="#06151A"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00D4FF"/>
        <stop offset="100%" stop-color="#00E599"/>
    </linearGradient>

    <radialGradient id="blueGlow">
        <stop offset="0%" stop-color="#00D4FF" stop-opacity=".23"/>
        <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGlow">
        <stop offset="0%" stop-color="#00E599" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#00E599" stop-opacity="0"/>
    </radialGradient>

</defs>


<!-- BACKGROUND -->

<rect
    width="1200"
    height="400"
    rx="28"
    fill="url(#background)"
/>


<!-- MOVING GLOW -->

<circle
    cx="970"
    cy="80"
    r="300"
    fill="url(#blueGlow)">

    <animate
        attributeName="cx"
        values="900;1050;900"
        dur="9s"
        repeatCount="indefinite"
    />

</circle>


<circle
    cx="120"
    cy="360"
    r="250"
    fill="url(#greenGlow)">

    <animate
        attributeName="cx"
        values="80;220;80"
        dur="12s"
        repeatCount="indefinite"
    />

</circle>


<!-- CYBER GRID -->

<g
    stroke="#00D4FF"
    stroke-width="1"
    opacity=".055">

    <path d="M0 50 H1200"/>
    <path d="M0 100 H1200"/>
    <path d="M0 150 H1200"/>
    <path d="M0 200 H1200"/>
    <path d="M0 250 H1200"/>
    <path d="M0 300 H1200"/>
    <path d="M0 350 H1200"/>

    <path d="M50 0 V400"/>
    <path d="M100 0 V400"/>
    <path d="M150 0 V400"/>
    <path d="M200 0 V400"/>
    <path d="M250 0 V400"/>
    <path d="M300 0 V400"/>
    <path d="M350 0 V400"/>
    <path d="M400 0 V400"/>
    <path d="M450 0 V400"/>
    <path d="M500 0 V400"/>
    <path d="M550 0 V400"/>
    <path d="M600 0 V400"/>
    <path d="M650 0 V400"/>
    <path d="M700 0 V400"/>
    <path d="M750 0 V400"/>
    <path d="M800 0 V400"/>
    <path d="M850 0 V400"/>
    <path d="M900 0 V400"/>
    <path d="M950 0 V400"/>
    <path d="M1000 0 V400"/>
    <path d="M1050 0 V400"/>
    <path d="M1100 0 V400"/>
    <path d="M1150 0 V400"/>

</g>


<!-- STATUS -->

<rect
    x="65"
    y="52"
    width="169"
    height="36"
    rx="18"
    fill="#0B201F"
    stroke="#00E599"
    stroke-opacity=".35"
/>

<circle
    cx="88"
    cy="70"
    r="6"
    fill="#00E599">

    <animate
        attributeName="opacity"
        values="1;.25;1"
        dur="1.8s"
        repeatCount="indefinite"
    />

</circle>

<text
    x="105"
    y="75"
    fill="#00E599"
    font-family="Arial, sans-serif"
    font-size="12"
    font-weight="700"
    letter-spacing="1.5">
    WORK IN PROGRESS
</text>


<!-- NAME -->

<text
    x="65"
    y="165"
    fill="#F8FAFC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="54"
    font-weight="800"
    letter-spacing="1">

    ALEXANDRE DUFOUR

</text>


<!-- JOB -->

<text
    x="68"
    y="211"
    fill="#00D4FF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="600"
    letter-spacing="4">

    CYBERSECURITY ADMINISTRATOR

</text>


<!-- ANIMATED LINE -->

<rect
    x="68"
    y="235"
    height="3"
    rx="2"
    fill="url(#accent)">

    <animate
        attributeName="width"
        values="0;485;485"
        dur="3s"
        repeatCount="indefinite"
    />

</rect>


<!-- DESCRIPTION -->

<text
    x="68"
    y="283"
    fill="#94A3B8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17">

    Infrastructure • Security • Microsoft • Automation

</text>


<!-- SECURITY SYMBOL -->

<g transform="translate(965 195)">

    <circle
        r="105"
        fill="#071B24"
        stroke="#00D4FF"
        stroke-width="1"
        stroke-opacity=".25">

        <animate
            attributeName="stroke-opacity"
            values=".15;.55;.15"
            dur="4s"
            repeatCount="indefinite"
        />

    </circle>


    <circle
        r="80"
        fill="none"
        stroke="#00E599"
        stroke-opacity=".18"
        stroke-dasharray="5 8">

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="0"
            to="360"
            dur="25s"
            repeatCount="indefinite"
        />

    </circle>


    <!-- SHIELD -->

    <path
        d="
        M0 -52
        L48 -32
        L40 22
        C34 55 0 72 0 72
        C0 72 -34 55 -40 22
        L-48 -32
        Z"

        fill="#00D4FF"
        fill-opacity=".07"
        stroke="#00D4FF"
        stroke-width="3"
    />


    <!-- CHECK -->

    <path
        d="M-20 4 L-5 20 L27 -18"
        fill="none"
        stroke="#00E599"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

</g>


<text
    x="965"
    y="338"
    text-anchor="middle"
    fill="#64748B"
    font-family="Arial, sans-serif"
    font-size="11"
    letter-spacing="3">

    SECURE • MONITOR • AUTOMATE

</text>


<!-- SCANNING LINE -->

<rect
    x="0"
    y="0"
    width="1200"
    height="1"
    fill="#00D4FF"
    opacity=".15">

    <animate
        attributeName="y"
        values="0;400;0"
        dur="8s"
        repeatCount="indefinite"
    />

</rect>

</svg>
