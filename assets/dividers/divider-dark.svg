<svg width="1200" height="35" viewBox="0 0 1200 35" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="line">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00E599" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="100" y="17" width="1000" height="1" fill="#1E293B"/>

  <circle cy="17" r="3" fill="#00D4FF">
    <animate attributeName="cx" values="100;1100;100" dur="7s" repeatCount="indefinite"/>
  </circle>

  <rect x="400" y="16" width="400" height="2" rx="1" fill="url(#line)" opacity=".5"/>

</svg>
